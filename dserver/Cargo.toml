[package]
name = "DServer"
version = "0.1.0"
edition = "2021"
default-run = "DServer"

[dependencies]
anyhow = "1"
async-graphql = "=7.0.2"
# Keep async-graphql's internal crates on the exact same release. The 7.0.2
# package declares semver-compatible ranges for these crates, which can otherwise
# resolve to a newer 7.x derive/parser/value set whose generated metadata no
# longer matches the 7.0.2 core types.
async-graphql-derive = "=7.0.2"
async-graphql-parser = "=7.0.2"
async-graphql-value = "=7.0.2"
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "blocking",
] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1.20"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.5", features = ["cors"] }
http = "1"
# Phase 112 (ADR-0022): D-Call endpoint URL validation (scheme/userinfo
# checks). Already present transitively via reqwest at 2.5.8 -- declared
# directly here rather than hand-parsing URLs, since a correct URL parser
# is exactly the kind of "smallest existing mechanism" the D-Call spec asks
# to reuse rather than reimplement.
url = "2"
