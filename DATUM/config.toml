[agent]
node_id = "fog-01"
cycle_s = 5
schema_version = "0.0.1"


[agent.events]
max_per_snapshot = 50
deduplicate = true
prefer_severity = true

[outputs.file_json]
enabled = true
path = "snapshot.json"

# futuro (stub)
[outputs.http]
enabled = true
url = "http://localhost:8080/api/v1/snapshots"
project_id = "smart-city-campinas"
timeout_s = 10

[dispatch]
enabled = false
url = "http://localhost:8080/api/v1/dispatch/for-node/{node_id}"
project_id = "smart-city-campinas"
timeout_s = 10
execute = false
publish_results = false
allow_container_execution = false

[collectors.process_windows]
enabled = true
mode = "group_by_name"
names = [
    "docker desktop.exe",
    "dockerd.exe",
    "datum.exe",
    "chrome.exe",
    "python.exe",
    "py.exe",
]
max_entries = 100
include_pids = false

#[collectors.process_linux]
#enabled = true
#mode = "all"
#mode = "allowlist"
#names = ["mosquitto", "sshd", "datum"]
#max_entries = 50

[collectors.connection_ping]
enabled = true
targets = ["1.1.1.1", "8.8.8.8"]
count = 4
timeout_s = 1

[collectors.docker]
enabled = true
mode = "all"

[auto_recovery]
enabled = true
dry_run = false
allow_services = ["local-http-proc", "local-http-ctr"]
cooldown_s = 60
max_attempts_per_window = 3
attempt_window_s = 300

[services]
enabled = true


#[[services.items]]
#name = "mosquitto"
#implemented_by = [{ container_name = "mosquitto" }]
#checks = [{ kind = "mqtt_pubsub", topic = "datum/health", timeout_ms = 1200 }]
