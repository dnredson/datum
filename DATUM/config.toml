#[[services.items]]
#name = "magistrala"
#implemented_by = [{ container_name = "magistrala" }]
#checks = [
#    { kind = "http_health", url = "http://127.0.0.1:9000/health", timeout_ms = 1200 },
#]

[service_registry]
enabled = true

#[[service_registry.services]]
#name = "local-http-proc"
#runtime = "process"

#[service_registry.services.selector]
#process_name = "python.exe"

#[service_registry.services.recovery]
#policy = "restart_command"
#command_windows = "py -m http.server 8001"
#command_linux = "python3 -m http.server 8001"
#working_dir = "."
#shell = false

#[[service_registry.services.checks]]
#kind = "http"
#url = "http://127.0.0.1:8001"
#timeout_ms = 1500

[[service_registry.services]]
name = "local-http-ctr"
runtime = "container"

[service_registry.services.selector]
container_name = "test-http"

[service_registry.services.recovery]
policy = "docker_restart"

[[service_registry.services.checks]]
kind = "http"
url = "http://127.0.0.1:8001"
timeout_ms = 1500

[desired_state]
enabled = true

#[[desired_state.services]]
#name = "local-http-proc"
#desired = "running"

[[desired_state.services]]
name = "local-http-ctr"
desired = "running"

