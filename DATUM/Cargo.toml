[package]
name = "datum"
version = "0.1.0"
edition = "2021"
default-run = "datum"

[lib]
test = false
doctest = false


[dependencies]
serde = { version = "1.0", features = ["derive"] }

reqwest = { version = "0.11", features = ["blocking", "json", "rustls-tls"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
toml = "0.8"
once_cell = "1.21.3"
crossterm = "0.27"
wasmtime = "27.0"
wat = "1.219.1"
sha2 = "0.10"
ctrlc = "3"
fs2 = "0.4"
