site_name: DATUM
site_description: Canonical documentation for DATUM and the IoTinuum runtime architecture

docs_dir: documentation

theme:
  name: material
  logo: assets/brand/datum-monochrome.png
  favicon: assets/brand/datum-icon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Concepts:
      - DATUM: concepts/datum.md
      - IoTinuum: concepts/iotinuum.md
      - D-Graph: concepts/dgraph.md
  - Architecture:
      - Overview: architecture/overview.md
      - dserver: architecture/dserver.md
      - SmartSentinel: architecture/smartsentinel.md
  - Decisions (ADR):
      - Index: adr/README.md
      - ADR-0001 Canonical DATUM vocabulary: adr/ADR-0001-canonical-datum-vocabulary.md
      - ADR-0002 D-Map single placement carrier: adr/ADR-0002-dmap-single-placement-carrier.md
      - ADR-0003 D-Node ABI datum-dnode/0: adr/ADR-0003-dnode-abi-v0.md
      - ADR-0004 Runtime-agnostic D-Node: adr/ADR-0004-dnode-runtime-agnostic-host.md
      - ADR-0005 D-Code vs Management WASM: adr/ADR-0005-dcode-and-management-wasm.md
      - ADR-0006 Canonical digest (JCS + SHA-256): adr/ADR-0006-canonical-digest-jcs-sha256.md
      - ADR-0007 datum-model crate: adr/ADR-0007-datum-model-crate.md
      - ADR-0008 Fresh instance per invocation: adr/ADR-0008-fresh-instance-per-invocation.md
      - ADR-0009 Application identity: adr/ADR-0009-application-identity.md
      - ADR-0010 Cross-node readiness: adr/ADR-0010-cross-node-readiness-fresh-evidence.md
      - ADR-0011 F2 execution-content authorization: adr/ADR-0011-f2-execution-content-authorization.md
      - ADR-0012 TOCTOU (deferred): adr/ADR-0012-toctou-authorization-validity.md
  - Data Models:
      - Snapshot: reference/snapshot-model.md
      - Local D-Graph Snapshot: reference/local-dgraph-snapshot.md
      - Capabilities: reference/capabilities-model.md
      - Action Execution Reports: reference/action-execution-report.md
      - Sentinel Registration: reference/sentinel-registration.md
      - Resource Registry: reference/resource-registry.md
      - Node / Hardware History: reference/node-incarnation-history.md
      - Operational WASM Reconciliation: reference/operational-wasm-reconciliation.md
      - Governed MQTT D-Call E2E: reference/governed-mqtt-dcall-e2e.md
  - API:
      - Overview: api/overview.md
  - Reference:
      - Glossary: reference/glossary.md
      - DATUM canonical model (Stage 107): reference/datum-canonical-model.md
      - VS1 contract fixtures: reference/vs1-contract-fixtures.md
      - Visual Identity: reference/visual-identity.md
